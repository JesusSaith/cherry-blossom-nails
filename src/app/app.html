<div class="shell">
  <mat-toolbar class="toolbar">
    <span class="brand">{{ title() }}</span>
  </mat-toolbar>

  <main class="content">
    <mat-card class="welcome" appearance="outlined">
      <mat-card-header>
        <mat-card-title>Proyecto listo</mat-card-title>
        <mat-card-subtitle>Angular, Material y Google Fonts</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <h1>{{ title() }}</h1>
        <p>
          La base del sitio ya está inicializada. Outfit lleva el texto y Cormorant Garamond los
          títulos.
        </p>
      </mat-card-content>
      <mat-card-actions>
        <button matButton="filled" type="button">Angular Material</button>
      </mat-card-actions>
    </mat-card>
  </main>
</div>
